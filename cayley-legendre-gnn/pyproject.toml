[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cayley-legendre-gnn"
version = "0.1.0"
description = "Cayley-Legendre implicit graph neural network for LRGB Peptides benchmarks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torch_geometric",
    "numpy",
    "scikit-learn",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
